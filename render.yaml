databases:
  - name: letsto-db
    databaseName: letsto_db
    user: letsto_user
    plan: free

services:
  - type: web
    name: letsto-platform
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn letsto_platform.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: TIME_ZONE
        value: "Asia/Kathmandu"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: letsto-db
          property: connectionString
